# /etc/modprobe.d/hardening-blacklist.conf
# "blacklist" stops automatic loading (by alias, when hardware/protocol is detected).
# "install ... /bin/false" makes ANY load attempt fail, including an explicit
# "modprobe" or another module pulling it in as a dependency. Both are needed.

# Uncommon network protocols (Lynis NETW-3200): almost never used on a server
# and with a history of kernel vulnerabilities.
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false

# USB mass storage (Lynis USB-1000): no use on a server, prevents data theft
# or malware introduction through USB devices.
blacklist usb-storage
install usb-storage /bin/false
