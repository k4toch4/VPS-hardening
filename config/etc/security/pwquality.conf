# /etc/security/pwquality.conf
# Password quality policy (Lynis AUTH-9262), aligned with NIST SP 800-63B:
# length and blocklists over composition rules.

# Minimum length. NIST 800-63B rev. 4 requires 15 for passwords used as a
# single factor (here: sudo and console login). Length is the strongest factor.
minlen = 15

# Credits: with negative/positive values, character types could "buy" length.
# 0 = no credits; length is counted literally.
dcredit = 0
ucredit = 0
lcredit = 0
ocredit = 0

# Do not require character classes (uppercase, digits, symbols).
# NIST advises against composition rules: they lead to predictable
# patterns like "Password1!". CIS uses minclass = 4 instead (see DECISIONS.md).
minclass = 0

# Reject passwords found in the cracklib dictionary (the "blocklist" NIST requires).
dictcheck = 1

# Reject passwords containing the username...
usercheck = 1
# ...or words from the user's full name (GECOS field).
gecoscheck = 1

# Organization-specific words that must never appear (space separated).
badwords = serverh hardening lab

# Block trivial patterns: more than 3 identical characters in a row ("aaaa")
# or monotonic sequences longer than 4 ("12345", "abcde").
maxrepeat = 3
maxsequence = 4

# New password must differ from the old one in at least 2 characters.
difok = 2

# Number of attempts before passwd gives up.
retry = 3

# Reject (not just warn) passwords that fail the checks...
enforcing = 1
# ...even when root sets them.
enforce_for_root
