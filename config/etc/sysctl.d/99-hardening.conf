# /etc/sysctl.d/99-hardening.conf
# Kernel and network hardening (Lynis KRNL-6000)

# ===================== KERNEL =====================

# Hide kernel memory addresses (/proc/kallsyms) even from root. Makes exploits harder.
kernel.kptr_restrict = 2

# Only root can read dmesg (it leaks addresses and hardware info).
kernel.dmesg_restrict = 1

# Disable the SysRq magic key (low-level commands from the keyboard/console).
kernel.sysrq = 0

# Core dumps include the PID in their name (prevents overwrites, helps forensics).
kernel.core_uses_pid = 1

# SUID programs do not generate core dumps (they could contain secrets in memory).
fs.suid_dumpable = 0

# Full memory layout randomization (ASLR). Usually already 2; made explicit.
kernel.randomize_va_space = 2

# Unprivileged users cannot load eBPF programs (a frequent exploit vector).
kernel.unprivileged_bpf_disabled = 1

# Harden the eBPF JIT compiler against JIT-spraying attacks.
net.core.bpf_jit_harden = 2

# A process can only ptrace (debug/inspect) its own children.
kernel.yama.ptrace_scope = 1

# Prevent unprivileged users from loading TTY line disciplines (past CVEs).
dev.tty.ldisc_autoload = 0

# Protect against link and FIFO attacks in shared directories like /tmp.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ===================== NETWORK: IPv4 =====================

# Ignore ICMP redirects (an attacker could alter our routes).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Do not send redirects: this server is not a router.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Reject source-routed packets (the sender dictates the path).
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log packets with impossible source addresses ("martians").
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Reverse path filtering: drop packets whose source could not route back (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# SYN cookies: keep accepting connections during a SYN flood.
net.ipv4.tcp_syncookies = 1

# Do not answer pings sent to broadcast addresses (Smurf attack).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses (avoids filling the logs).
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ===================== NETWORK: IPv6 =====================

# Same as IPv4: no redirects and no source routing.
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ===================== INTENTIONALLY NOT APPLIED =====================
# kernel.modules_disabled = 1   -> blocks loading ANY module until reboot; breaks hardware/services.
# net.ipv4.tcp_timestamps = 0   -> small info-leak gain; loses TCP protections (PAWS) and performance.
# net.ipv6.conf.*.accept_ra = 0 -> many VPS providers configure IPv6 via RA; it would drop connectivity.
# kernel.perf_event_paranoid    -> Ubuntu already ships a stricter value; lowering it would weaken it.
# kernel.yama.ptrace_scope = 2+ -> breaks debuggers (gdb, strace) even for admins.
