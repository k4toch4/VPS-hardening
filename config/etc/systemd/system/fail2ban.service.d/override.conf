# Cannot gain new privileges (e.g. via setuid binaries)
NoNewPrivileges=yes
# Private /tmp and /dev, invisible to the rest of the system
PrivateTmp=yes
PrivateDevices=yes
# /home and /root are inaccessible
ProtectHome=yes
# Whole filesystem read-only, except what fail2ban needs to write:
# its database, its socket, its log, and UFW rules (banaction = ufw)
ProtectSystem=strict
ReadWritePaths=/var/lib/fail2ban /run /var/log /etc/ufw
# Cannot touch cgroups, kernel logs, clock or hostname
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
# Block uncommon kernel features often used in exploits
RestrictRealtime=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
